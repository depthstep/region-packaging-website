# Every push to main: type-check, run the full production build, then publish a static
# preview of the site to GitHub Pages. Pull requests: checks and full build only.
#
# The Pages preview is plain files built from content/*.ts, so the quote API and the Payload
# admin are left out of it (the form shows a "design preview" notice). The full build still checks them.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Full production build
        run: npm run build

      - name: Static preview build
        if: github.event_name != 'pull_request'
        run: |
          rm -rf app/api "app/(payload)" .next
          npx next build
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_STATIC_PREVIEW: '1'
          # Optional repo variables: lets the preview's Contact Us form post to a test Google Sheet.
          NEXT_PUBLIC_PREVIEW_SHEET_URL: ${{ vars.PREVIEW_SHEET_URL }}
          NEXT_PUBLIC_PREVIEW_SHEET_SECRET: ${{ vars.PREVIEW_SHEET_SECRET }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
