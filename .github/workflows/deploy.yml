# Every push to main: type-check, run the full production build, then publish a static
# preview of the site to GitHub Pages. Pull requests: checks and full build only.
#
# The Pages preview is plain files built from content/*.ts, so the quote API and the Payload
# admin are left out of it (the form shows a "design preview" notice). The full build still checks them.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancelled part-way: a stopped deploy could leave the server with half an update.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Full production build
        run: npm run build
        env:
          STANDALONE: '1'
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          SITE_NOINDEX: ${{ vars.SITE_NOINDEX }}

      # The real site. The database, photos and settings stay in ~/rp/shared on the server.
      - name: Deploy to the server
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          SITE_URL: ${{ vars.SITE_URL }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          cp scripts/passenger.cjs .next/standalone/
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -az --delete --exclude tmp -e 'ssh -i ~/.ssh/deploy' .next/standalone/ "$DEPLOY_USER@$HOST:rp/app/"
          ssh -i ~/.ssh/deploy "$DEPLOY_USER@$HOST" 'mkdir -p rp/app/tmp && touch rp/app/tmp/restart.txt'
          domain="${SITE_URL#https://}"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 --resolve "$domain:443:$HOST" -X POST -H "x-revalidate-secret: $REVALIDATE_SECRET" "$SITE_URL/api/revalidate" || true)
            [ "$code" = 200 ] && break
            sleep 10
          done
          echo "revalidate: $code"
          [ "$code" = 200 ]

      - name: Static preview build
        if: github.event_name != 'pull_request'
        run: |
          rm -rf app/api "app/(payload)" .next
          npx next build
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_STATIC_PREVIEW: '1'
          # Optional repo variables: lets the preview's Contact Us form post to a test Google Sheet.
          NEXT_PUBLIC_PREVIEW_SHEET_URL: ${{ vars.PREVIEW_SHEET_URL }}
          NEXT_PUBLIC_PREVIEW_SHEET_SECRET: ${{ vars.PREVIEW_SHEET_SECRET }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
